services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sms
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: sms_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d sms"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - sms-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sms-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
      - /app/backend/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - sms-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: sms-frontend
    restart: unless-stopped

    ports:
      - "5174:5174"

    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1

    volumes:
      - ./frontend:/app/frontend
      - ./packages:/app/packages
      - /app/frontend/node_modules

    depends_on:
      - backend

    networks:
      - sms-network

volumes:
  postgres_data:

networks:
  sms-network:
    driver: bridge
